[build-system]
requires=["setuptools>=68"]
build-backend="setuptools.build_meta"

[project]
name="privacy-aware-recommender-lab"
version="0.1.0"
description="Recommendation lab constrained to explicitly opted-in preferences and minimum cohort support to reduce hidden inference risks."
requires-python=">=3.10"
license={text="MIT"}
authors=[{name="Syed Hafiz Ali"}]

[tool.setuptools]
py-modules=["privacy_aware_recommender_lab"]
